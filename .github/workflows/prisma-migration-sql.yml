name: Generate initial migration SQL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prisma-migration-sql.yml"]
permissions:
  contents: write
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Build migration from schema
        run: |
          mkdir -p prisma/migrations/0001_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0001_init/migration.sql
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git diff --cached --quiet || git commit -m "LDITNW-11: initial migration SQL generated from schema [skip ci]"
          git push
